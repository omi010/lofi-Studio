<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lofi Studio">
<meta name="theme-color" content="#120f1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Lofi Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Noto+Sans+Devanagari:wght@600&family=Pacifico&family=Playfair+Display:wght@600&family=Poppins:wght@400;600&family=Space+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120f1c; --panel:#1b1729; --card:#241f36; --line:#332c4b;
  --text:#f1ecff; --muted:#a59cc3; --accent:#f6c177; --accent2:#c4a7e7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font-family:"Poppins",system-ui,-apple-system,sans-serif;font-size:15px}
body{display:flex;flex-direction:column;height:100dvh;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
header{display:flex;align-items:center;justify-content:space-between;
  padding:calc(10px + env(safe-area-inset-top)) calc(14px + env(safe-area-inset-right)) 6px calc(14px + env(safe-area-inset-left))}
.logo{font-weight:600;font-size:18px;letter-spacing:.3px}
.logo span{color:var(--accent)}
.btn{border:0;border-radius:12px;padding:10px 16px;background:var(--card);font-weight:600}
.btn.primary{background:linear-gradient(135deg,var(--accent),#eb9f6a);color:#1b1206}
.btn.block{width:100%;padding:13px 16px;margin:6px 0}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.45}
#stage{position:relative;display:flex;align-items:center;justify-content:center;
  height:min(40dvh,62vw);padding:0 12px}
#cv{max-width:100%;max-height:100%;width:auto;height:auto;border-radius:10px;
  background:#000;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  text-align:center;padding:30px;color:var(--muted);pointer-events:none;font-size:14px}
.transport{display:flex;align-items:center;gap:10px;padding:10px 14px}
#play{width:46px;height:46px;border-radius:50%;border:0;background:var(--accent);color:#1b1206;
  font-size:18px;flex:none;display:flex;align-items:center;justify-content:center}
.time{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);min-width:38px;text-align:center}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;
  background:var(--text);margin-top:-9px;box-shadow:0 2px 6px rgba(0,0,0,.4)}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--line)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--text);border:0}
#panel{flex:1;overflow-y:auto;background:var(--panel);border-radius:18px 18px 0 0;
  padding:14px 16px 20px;-webkit-overflow-scrolling:touch}
#panel h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.row{margin:10px 0}
.row .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.row .lbl b{color:var(--text);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.chip{border:1px solid var(--line);background:transparent;border-radius:20px;padding:7px 13px;font-size:13px}
.chip.on{background:var(--accent2);color:#160f26;border-color:var(--accent2);font-weight:600}
.card{background:var(--card);border-radius:14px;padding:12px;margin:10px 0}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.info{font-size:13px;line-height:1.6}
.info b{color:var(--accent)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line)}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;border:0;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--accent)}
.sw.on::after{left:21px}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;
  background:rgba(0,0,0,.7);font-size:13px;line-height:24px;padding:0}
.thumb span{position:absolute;left:4px;bottom:3px;font-size:11px;background:rgba(0,0,0,.6);padding:0 5px;border-radius:6px}
textarea,input[type=number]{width:100%;background:#15121f;color:var(--text);border:1px solid var(--line);
  border-radius:10px;padding:10px;font:inherit;font-size:16px}
input[type=color]{width:38px;height:32px;border:0;padding:0;background:none;border-radius:8px}
.swatches{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.swatch{width:28px;height:28px;border-radius:50%;border:2px solid var(--line)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two label{font-size:12px;color:var(--muted)}
.cardhead{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.del{border:0;background:#3a2234;color:#ffb4c4;border-radius:10px;padding:6px 10px;font-size:12px}
nav#tools{display:flex;gap:4px;overflow-x:auto;background:#0e0b16;border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
nav#tools button{flex:1 0 64px;border:0;background:transparent;display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:6px 2px;border-radius:12px}
nav#tools button i{font-style:normal;font-size:21px;line-height:1}
nav#tools button.on{color:var(--text);background:var(--card)}
#modal{position:fixed;inset:0;background:rgba(8,6,14,.86);display:none;align-items:flex-end;justify-content:center;z-index:20}
#modal.show{display:flex}
.sheet{width:100%;max-width:560px;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));max-height:92dvh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:18px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;margin:14px 0 6px}
.bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent2),var(--accent));transition:width .3s}
.sheet video,.sheet audio{width:100%;border-radius:12px;margin:10px 0;background:#000;max-height:46dvh}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#2c2542;padding:10px 16px;
  border-radius:12px;font-size:13px;z-index:30;opacity:0;transition:.3s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin:10px 0}
.check input{width:20px;height:20px}
</style>
</head>
<body>
<header>
  <div class="logo">Lofi <span>Studio</span></div>
  <button class="btn primary" id="exportBtn">Export</button>
</header>

<div id="stage">
  <canvas id="cv" width="1280" height="720"></canvas>
  <div id="empty">Tap <b>&nbsp;Song&nbsp;</b> and <b>&nbsp;Images&nbsp;</b> below to start your lofi video</div>
</div>

<div class="transport">
  <button id="play" aria-label="Play">&#9654;</button>
  <span class="time" id="tCur">0:00</span>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <span class="time" id="tDur">0:00</span>
</div>

<section id="panel"></section>

<nav id="tools">
  <button data-p="song"><i>🎵</i>Song</button>
  <button data-p="bg"><i>🌧️</i>Background</button>
  <button data-p="images"><i>🖼️</i>Images</button>
  <button data-p="text"><i>🅃</i>Text</button>
  <button data-p="vibe"><i>🎚️</i>Lofi vibe</button>
  <button data-p="volume"><i>🔊</i>Volume</button>
  <button data-p="visuals"><i>✨</i>Effects</button>
  <button data-p="format"><i>📐</i>Format</button>
</nav>

<div id="modal"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<input type="file" id="fSong" accept="audio/*,.mp3,.mpeg,.mpga,.m4a,.aac,.wav,.flac,.ogg" hidden>
<input type="file" id="fBg" accept="audio/*,.mp3,.mpeg,.mpga,.m4a,.aac,.wav,.flac,.ogg" hidden>
<input type="file" id="fImg" accept="image/*" multiple hidden>

<script>
"use strict";
/* ============================================================ state */
const $ = s => document.querySelector(s);
const PRESETS = {
  off:    {speed:1.00, warmth:20000, reverb:0.00, bass:0, crackleVol:0.00, wobble:0.00},
  light:  {speed:0.95, warmth:9000,  reverb:0.18, bass:2, crackleVol:0.25, wobble:0.15},
  medium: {speed:0.90, warmth:6500,  reverb:0.30, bass:3, crackleVol:0.40, wobble:0.30},
  heavy:  {speed:0.85, warmth:4500,  reverb:0.45, bass:5, crackleVol:0.55, wobble:0.50},
  slowrev:{speed:0.85, warmth:12000, reverb:0.60, bass:2, crackleVol:0.10, wobble:0.10},
};
const DEFAULTS = Object.assign({
  preset:'medium', songVol:1, bgVol:0.25, master:1, fadeIn:2, fadeOut:4,
  bgType:'none', secPerImg:12, xfade:2, zoom:0.5,
  rain:false, grain:true, vignette:true, dark:0.15, viz:false, progress:true,
  aspect:'16:9', quality:'720', listen:false, texts:[]
}, PRESETS.medium);
const KEY = 'lofiStudio.v1';
let S = Object.assign({}, DEFAULTS);
try { const s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) S = Object.assign(S, s); } catch (e) {}
let saveTimer = 0;
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(() => {
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }, 300); }

let songBuf = null, songName = '', bgBuf = null, bgName = '';
let images = [];          // {src: canvas, url}
let dirty = true;
const markDirty = () => { dirty = true; };

/* ============================================================ utils */
const fmt = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), x = Math.floor(s % 60);
  return m + ':' + String(x).padStart(2, '0'); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function toast(msg, ms){ const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), ms || 2600); }
function cleanName(n){
  return n.replace(/(\.(mp3|mpeg|mpga|m4a|aac|wav|flac|ogg|mp4))+$/i, '')
          .replace(/\b\d{2,3}\s?kbps\b/ig, '').replace(/[_]+/g, ' ').replace(/\s{2,}/g, ' ').trim();
}
const safeFile = s => (s || 'lofi').replace(/[<>:"/\\|?*]+/g, '').trim() || 'lofi';
function dur(){ return songBuf ? songBuf.duration / S.speed : 30; }

/* ============================================================ audio core */
let AC = null;
function ensureAC(){
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  }
  if (AC.state !== 'running') AC.resume().catch(() => {});
  return AC;
}
function decode(ab){
  const ac = ensureAC();
  return new Promise((res, rej) => ac.decodeAudioData(ab, res, rej));
}
const genCache = {};
function genBuffer(kind, sr){
  const k = kind + sr; if (genCache[k]) return genCache[k];
  const secs = kind === 'ocean' ? 12.5 : 8, n = Math.floor(secs * sr);
  const tmp = new OfflineAudioContext(2, 1, sr);
  const buf = tmp.createBuffer(2, n, sr);
  const L = buf.getChannelData(0), R = buf.getChannelData(1);
  const rnd = () => Math.random() * 2 - 1;
  if (kind === 'crackle') {
    let h = 0;
    for (let i = 0; i < n; i++) { h += (rnd() - h) * 0.35; L[i] = h * 0.012; }
    const pops = Math.floor(secs * 11);
    for (let p = 0; p < pops; p++) {
      const at = Math.floor(Math.random() * (n - 400)), len = 20 + Math.floor(Math.random() * 140);
      const amp = (Math.random() < 0.08 ? 0.45 : 0.06 + Math.random() * 0.2) * (Math.random() < 0.5 ? -1 : 1);
      for (let j = 0; j < len; j++) L[at + j] += amp * Math.exp(-j / (len / 4)) * (j % 2 ? 1 : 0.6);
    }
    for (let i = 0; i < n; i++) R[i] = L[(i + 37) % n];
  } else if (kind === 'rain') {
    for (const C of [L, R]) {
      let a = 0, b = 0;
      for (let i = 0; i < n; i++) { const w = rnd(); a += (w - a) * 0.45; b += (w - b) * 0.02; C[i] = (a - b) * 0.22; }
      const drops = Math.floor(secs * 28);
      for (let d = 0; d < drops; d++) {
        const at = Math.floor(Math.random() * (n - 600)), f = 1800 + Math.random() * 3500,
              amp = 0.03 + Math.random() * 0.12, len = Math.floor(sr * 0.012);
        for (let j = 0; j < len; j++) C[at + j] += amp * Math.sin(2 * Math.PI * f * j / sr) * Math.exp(-j / (len / 5));
      }
    }
  } else if (kind === 'ocean' || kind === 'night') {
    for (const C of [L, R]) {
      let b = 0, a = 0;
      for (let i = 0; i < n; i++) {
        const w = rnd(); b = (b + 0.02 * w) / 1.02; a += (w - a) * 0.08;
        if (kind === 'night') C[i] = b * 2.6 + a * 0.015;
        else { const env = 0.35 + 0.65 * Math.pow(0.5 - 0.5 * Math.cos(2 * Math.PI * i / n), 1.6);
               C[i] = (b * 2.4 + a * 0.18) * env; }
      }
    }
  }
  // soften loop seam
  const fadeN = Math.floor(sr * 0.05);
  for (const C of [L, R]) for (let i = 0; i < fadeN; i++) { const g = i / fadeN;
    C[i] = C[i] * g + C[n - fadeN + i] * (1 - g); }
  return (genCache[k] = buf);
}
function makeIR(ac){
  const k = 'ir' + ac.sampleRate; if (genCache[k]) return genCache[k];
  const sr = ac.sampleRate, n = Math.floor(sr * 2.8), buf = ac.createBuffer(2, n, sr);
  for (let c = 0; c < 2; c++) { const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.2) * (i < sr * 0.01 ? i / (sr * 0.01) : 1); }
  return (genCache[k] = buf);
}

/* Builds the full lofi chain. pos = video time to start from, when = context time */
function buildGraph(ac, dest, pos, when){
  const len = dur(), sp = S.speed, base = when - pos, endAt = base + len + 0.05;
  const N = {}, sources = [];
  const mix = ac.createGain();
  const fade = ac.createGain();
  N.vol = ac.createGain(); N.vol.gain.value = S.master;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -10; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.25;
  mix.connect(fade); fade.connect(N.vol); N.vol.connect(comp); comp.connect(dest);

  // fades
  const fi = Math.min(S.fadeIn, len / 2), fo = Math.min(S.fadeOut, Math.max(0, len - fi));
  let v = 1; if (fi > 0 && pos < fi) v = Math.min(v, pos / fi);
  if (fo > 0 && pos > len - fo) v = Math.min(v, (len - pos) / fo);
  const fg = fade.gain; fg.setValueAtTime(v, when);
  if (fi > 0 && pos < fi) fg.linearRampToValueAtTime(1, base + fi);
  if (fo > 0) { if (len - fo > pos) fg.setValueAtTime(1, base + len - fo); fg.linearRampToValueAtTime(0, base + len); }

  if (songBuf) {
    const src = ac.createBufferSource(); src.buffer = songBuf; src.playbackRate.value = sp;
    if (S.wobble > 0) {
      for (const [f, d] of [[0.55, 0.012], [6.5, 0.0022]]) {
        const o = ac.createOscillator(), g = ac.createGain();
        o.frequency.value = f; g.gain.value = S.wobble * d * sp;
        o.connect(g); g.connect(src.playbackRate); o.start(when); o.stop(endAt); sources.push(o);
      }
    }
    N.song = ac.createGain(); N.song.gain.value = S.songVol;
    const hp = ac.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 30;
    N.bass = ac.createBiquadFilter(); N.bass.type = 'lowshelf'; N.bass.frequency.value = 120; N.bass.gain.value = S.bass;
    N.lp = ac.createBiquadFilter(); N.lp.type = 'lowpass'; N.lp.frequency.value = S.warmth; N.lp.Q.value = 0.7;
    N.dry = ac.createGain(); N.dry.gain.value = 1 - S.reverb * 0.4;
    N.wet = ac.createGain(); N.wet.gain.value = S.reverb * 1.3;
    const conv = ac.createConvolver(); conv.buffer = makeIR(ac);
    src.connect(N.song); N.song.connect(hp); hp.connect(N.bass); N.bass.connect(N.lp);
    N.lp.connect(N.dry); N.dry.connect(mix); N.lp.connect(conv); conv.connect(N.wet); N.wet.connect(mix);
    const off = pos * sp;
    if (off < songBuf.duration) { src.start(when, off); sources.push(src); }
  }
  // vinyl crackle
  N.crackle = ac.createGain(); N.crackle.gain.value = S.crackleVol * 0.7; N.crackle.connect(mix);
  const cb = genBuffer('crackle', ac.sampleRate);
  const cs = ac.createBufferSource(); cs.buffer = cb; cs.loop = true; cs.connect(N.crackle);
  cs.start(when, pos % cb.duration); cs.stop(endAt); sources.push(cs);
  // background
  let bb = null;
  if (S.bgType === 'file' && bgBuf) bb = bgBuf;
  else if (['rain', 'ocean', 'night'].includes(S.bgType)) bb = genBuffer(S.bgType, ac.sampleRate);
  N.bg = ac.createGain(); N.bg.gain.value = S.bgVol; N.bg.connect(mix);
  if (bb) { const bs = ac.createBufferSource(); bs.buffer = bb; bs.loop = true; bs.connect(N.bg);
    bs.start(when, pos % bb.duration); bs.stop(endAt); sources.push(bs); }

  return { N, stop(){ for (const s of sources) { try { s.stop(); } catch (e) {} } try { comp.disconnect(); } catch (e) {} } };
}

/* ============================================================ live preview */
let playing = false, live = null, liveAn = null, t0 = 0, pos0 = 0, pausedT = 0;
let exporting = false, expAn = null, expT = () => 0;
function curT(){
  if (exporting) return expT();
  if (playing && AC) return Math.min(dur(), pos0 + AC.currentTime - t0);
  return pausedT;
}
function play(){
  const ac = ensureAC();
  if (pausedT >= dur() - 0.05) pausedT = 0;
  const when = ac.currentTime + 0.06;
  liveAn = ac.createAnalyser(); liveAn.fftSize = 256; liveAn.smoothingTimeConstant = 0.75;
  liveAn.connect(ac.destination);
  live = buildGraph(ac, liveAn, pausedT, when);
  t0 = when; pos0 = pausedT; playing = true; updatePlay();
}
function pause(){
  if (!playing) return;
  pausedT = curT(); if (live) live.stop(); live = null; playing = false; updatePlay(); markDirty();
}
function restartIfPlaying(){ if (playing) { const t = curT(); pause(); pausedT = t; play(); } markDirty(); }
function applyLive(){
  if (!live || !AC) return; const N = live.N, now = AC.currentTime, k = 0.04;
  if (N.song) { N.song.gain.setTargetAtTime(S.songVol, now, k); N.lp.frequency.setTargetAtTime(S.warmth, now, k);
    N.bass.gain.setTargetAtTime(S.bass, now, k); N.dry.gain.setTargetAtTime(1 - S.reverb * 0.4, now, k);
    N.wet.gain.setTargetAtTime(S.reverb * 1.3, now, k); }
  N.crackle.gain.setTargetAtTime(S.crackleVol * 0.7, now, k);
  N.bg.gain.setTargetAtTime(S.bgVol, now, k); N.vol.gain.setTargetAtTime(S.master, now, k);
}
function updatePlay(){ $('#play').innerHTML = playing ? '&#10073;&#10073;' : '&#9654;'; }
$('#play').onclick = () => { if (exporting) return; playing ? pause() : play(); };
$('#seek').oninput = e => {
  const t = e.target.value / 1000 * dur(); const was = playing; if (was) pause(); pausedT = t;
  if (was) play(); markDirty();
};

/* ============================================================ canvas */
const cv = $('#cv'), g = cv.getContext('2d');
let W = 1280, H = 720, vignette = null, grainPats = [];
const SIZES = { '16:9': [16, 9], '9:16': [9, 16], '1:1': [1, 1] };
function resize(){
  const [a, b] = SIZES[S.aspect] || SIZES['16:9'];
  const short = S.quality === '1080' ? 1080 : 720;
  if (a >= b) { H = short; W = Math.round(short * a / b); } else { W = short; H = Math.round(short * b / a); }
  W -= W % 2; H -= H % 2;
  cv.width = W; cv.height = H;
  const R = Math.hypot(W, H) / 2;
  vignette = g.createRadialGradient(W / 2, H / 2, R * 0.45, W / 2, H / 2, R);

function readFile(f){
  return new Promise((res, rej) => {
    const go = () => { const r = new FileReader();
      r.onload = () => res(r.result); r.onerror = () => rej(r.error || new Error('read failed')); r.readAsArrayBuffer(f); };

function loadMpg(){
  if (window['mpg123-decoder']) return Promise.resolve(window['mpg123-decoder']);
  if (!mpgLib) mpgLib = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'mpg123-decoder.min.js';
    s.onload = () => window['mpg123-decoder'] ? res(window['mpg123-decoder']) : rej(new Error('decoder missing'));

  const sw = ['#ffffff', '#f6c177', '#c4a7e7', '#9ccfd8', '#eb6f92', '#1b1206'].map(c =>
    el('button', { class: 'swatch', style: 'background:' + c, onclick: () => { L.color = c; color.value = c; ch(); }, 'aria-label': c }));
  const num = (key, ph) => { const n = el('input', { type: 'number', min: 0, step: 1, inputmode: 'decimal', placeholder: ph });
    n.value = L[key] || ''; n.oninput = () => { L[key] = parseFloat(n.value) || 0; ch(); }; return n; };
  return el('div', { class: 'card' },
    el('div', { class: 'cardhead' }, el('span', null, 'Text ' + (i + 1)),
      el('button', { class: 'del', onclick: () => { S.texts.splice(i, 1); ch(); renderPanel(); } }, 'Delete')),
    ta,
    chips(Object.entries(FONTS).map(([k, f]) => [k, f.label]), L.font, v => { L.font = v; ch(); renderPanel(); }),
    slider('Size', () => L.size, v => { L.size = v; }, 2, 16, 0.1, v => v.toFixed(1)),
    el('div', { class: 'swatches' }, ...sw, color),
    chips([['top', 'Top'], ['center', 'Middle'], ['bottom', 'Bottom']], L.pos, v => { L.pos = v; ch(); renderPanel(); }),
    chips([['left', 'Left'], ['center', 'Center'], ['right', 'Right']], L.align, v => { L.align = v; ch(); renderPanel(); }),
    slider('Move up / down', () => L.offset, v => { L.offset = v; }, -40, 40, 0.5, v => (v > 0 ? '+' : '') + v),
    el('div', { class: 'toggle' }, el('span', null, 'Shadow'),
      (() => { const b = el('button', { class: 'sw' + (L.shadow !== false ? ' on' : '') });
        b.onclick = () => { L.shadow = L.shadow === false; b.classList.toggle('on', L.shadow); ch(); }; return b; })()),
    el('div', { class: 'two', style: 'margin-top:10px' },
      el('div', null, el('label', null, 'Show from (sec)'), num('start', '0')),
      el('div', null, el('label', null, 'Until (sec, empty = end)'), num('end', 'end'))));
}
function renderPanel(){
  const p = $('#panel'), top = p.scrollTop; p.innerHTML = '';
  for (const n of PANELS[current]()) if (n) p.append(n);
  p.scrollTop = top;
  document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.p === current));
}
function renderChipsOnly(){ const first = $('#panel .chips'); if (!first) return;
  first.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.textContent === 'Custom')); }
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => {
  current = b.dataset.p; $('#panel').scrollTop = 0; renderPanel(); });

/* ============================================================ export */
let dlPromise = null;
function getDownloads(){
  if (!dlPromise) dlPromise = (window.claude && typeof window.claude.use === 'function')
    ? Promise.resolve(window.claude.use('downloads')).catch(() => null) : Promise.resolve(null);
  return dlPromise;
}
setTimeout(getDownloads, 0);
const inClaude = () => !!(window.claude && typeof window.claude.use === 'function');
function toFile(blob, name){
  const type = (blob.type || '').split(';')[0] || (name.endsWith('.webm') ? 'video/webm' : 'video/mp4');
  try { return new File([blob], name, { type }); } catch (e) { return null; }
}
const canShareFile = f => !!(f && navigator.canShare && navigator.share && navigator.canShare({ files: [f] }));
/* Save to Photos / any app via the iPhone share sheet (must run straight from the tap) */
function shareBlob(blob, name){
  const f = toFile(blob, name);
  if (!canShareFile(f)) { downloadBlob(blob, name); return; }
  navigator.share({ files: [f], title: name }).then(() => toast('Done ✓'))
    .catch(e => { if (e && e.name === 'AbortError') return; downloadBlob(blob, name); });
}
function downloadBlob(blob, name){
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  toast('Saved to Files → Downloads. If nothing happened, long-press the video and choose Save.', 5000);
}
async function saveBlob(blob, name){
  if (!inClaude()) { downloadBlob(blob, name); return; }
  const dl = await getDownloads();
  if (dl) {
    try { await dl.save({ filename: name, data: blob }); toast('Saved ✓'); }
    catch (e) { if (e && e.code === 'declined') return;
      if (e && e.code === 'rate_limited') toast('Please wait a moment and tap Save again');
      else toast('Could not save here (' + ((e && e.code) || 'error') + '). Long-press the video to save it.', 5000); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove();
  toast('If nothing downloaded, long-press the video and choose Save', 5000);
}
function pickMime(kind){
  if (typeof MediaRecorder === 'undefined') return null;
  const list = kind === 'video'
    ? ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4;codecs=avc1,mp4a', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    : ['audio/mp4;codecs=mp4a.40.2', 'audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'];
  for (const m of list) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch (e) {} }
  return '';
}
const sheet = $('#sheet'), modal = $('#modal');
let expProgress = null, cancelExport = null, lastResult = null;
function openExport(){
  if (exporting) return; modal.classList.add('show'); pause();
  const canVideo = typeof MediaRecorder !== 'undefined' && !!cv.captureStream;
  sheet.innerHTML = '';
  const listen = el('input', { type: 'checkbox' }); listen.checked = !!S.listen;
  listen.onchange = () => { S.listen = listen.checked; save(); };
  sheet.append(
    el('h2', null, 'Export'),
    el('p', { class: 'note', html: songBuf
      ? 'Length <b>' + fmt(dur()) + '</b> · ' + S.aspect + ' · ' + S.quality + 'p.<br>Export runs in real time, so it takes about <b>' + fmt(dur()) +
        '</b>. Keep this screen open and your phone unlocked until it finishes.'
      : 'Add a song first (🎵 Song).' }),
    el('button', { class: 'btn primary block', disabled: !songBuf || !canVideo ? '' : null, onclick: () => runExport('video') }, '🎬 Export video (.mp4)'),
    el('button', { class: 'btn block', disabled: !songBuf || typeof MediaRecorder === 'undefined' ? '' : null, onclick: () => runExport('audio') }, '🎧 Export lofi audio only'),
    el('label', { class: 'check' }, listen, 'Play sound while exporting'),
    !canVideo ? el('p', { class: 'note' }, 'This browser cannot record video. Update to iOS 15 or newer and use Safari.') : null,
    lastResult ? el('button', { class: 'btn ghost block', onclick: () => showResult(lastResult) }, 'Show last export') : null,
    el('button', { class: 'btn ghost block', onclick: closeModal }, 'Close'));
  [...sheet.querySelectorAll('button')].forEach(b => { if (b.getAttribute('disabled') === 'null') b.removeAttribute('disabled'); });
}
function closeModal(){ if (!exporting) modal.classList.remove('show'); }
modal.onclick = e => { if (e.target === modal) closeModal(); };
$('#exportBtn').onclick = openExport;

async function runExport(kind){
  if (!songBuf || exporting) return;
  const ac = ensureAC(); const L = dur(); let cancelled = false, src = null, rec = null, wake = null, tracks = [];
  exporting = true; expT = () => 0; expAn = null;
  const label = el('div', { class: 'note' }, 'Preparing lofi audio…');
  const bar = el('div', { class: 'bar' }, el('div'));
  const timeTxt = el('div', { class: 'note' }, '');
  sheet.innerHTML = '';
  sheet.append(el('h2', null, kind === 'video' ? 'Making your video…' : 'Making your audio…'), label, bar, timeTxt,
    el('p', { class: 'note' }, 'Keep this screen open. Locking the phone or switching apps will stop the export.'),
    el('button', { class: 'btn ghost block', onclick: () => { cancelled = true; if (cancelExport) cancelExport(); } }, 'Cancel'));
  const setBar = f => { bar.firstChild.style.width = Math.round(clamp(f, 0, 1) * 100) + '%'; };
  try {
    try { if (navigator.wakeLock) wake = await navigator.wakeLock.request('screen'); } catch (e) {}
    // 1) render the lofi audio offline (fast)
    const sr = ac.sampleRate, off = new OfflineAudioContext(2, Math.ceil(L * sr), sr);
    buildGraph(off, off.destination, 0, 0);
    const rendered = await off.startRendering();
    if (cancelled) throw 'cancel';
    // 2) record in real time
    const md = ac.createMediaStreamDestination(), an = ac.createAnalyser();
    an.fftSize = 256; an.smoothingTimeConstant = 0.75;
    src = ac.createBufferSource(); src.buffer = rendered; src.connect(an); an.connect(md);
    if (S.listen) an.connect(ac.destination);
    tracks = [...md.stream.getAudioTracks()];
    if (kind === 'video') { const vs = cv.captureStream(30); tracks = [...vs.getVideoTracks(), ...tracks]; }
    const stream = new MediaStream(tracks), mime = pickMime(kind);
    const opts = { audioBitsPerSecond: 192000 };
    if (mime) opts.mimeType = mime;
    if (kind === 'video') opts.videoBitsPerSecond = S.quality === '1080' ? 8000000 : 5000000;
    rec = new MediaRecorder(stream, opts);
    const chunks = []; rec.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(r => { rec.onstop = r; });
    const ended = new Promise(r => { src.onended = r; });
    cancelExport = () => { try { src.stop(); } catch (e) {} };
    rec.start(1000);
    const start = ac.currentTime + 0.25;
    expAn = an; expT = () => clamp(ac.currentTime - start, 0, L);
    label.textContent = kind === 'video' ? 'Recording video…' : 'Recording audio…';
    expProgress = t => { setBar(t / L); timeTxt.textContent = fmt(t) + ' / ' + fmt(L); };
    src.start(start);
    await ended;
    await new Promise(r => setTimeout(r, 400));
    rec.stop(); await stopped;
    if (cancelled) throw 'cancel';
    const type = rec.mimeType || mime || (kind === 'video' ? 'video/mp4' : 'audio/mp4');
    const ext = type.includes('mp4') ? 'mp4' : 'webm';
    const blob = new Blob(chunks, { type });
    const name = safeFile(songName) + (kind === 'video' ? ' lofi video.' : ' lofi audio.') + ext;
    lastResult = { blob, name, kind, url: URL.createObjectURL(blob) };
    exporting = false; showResult(lastResult);
  } catch (e) {
    exporting = false;
    if (e === 'cancel') { toast('Export cancelled'); openExport(); }
    else { console.error(e); sheet.innerHTML = '';
      sheet.append(el('h2', null, 'Export failed'), el('p', { class: 'note' }, String(e && e.message || e)),
        el('p', { class: 'note' }, 'Try 720p, close other apps, and keep the screen on.'),
        el('button', { class: 'btn block', onclick: openExport }, 'Back')); }
  } finally {
    exporting = false; expProgress = null; cancelExport = null; expAn = null;
    tracks.forEach(t => { try { t.stop(); } catch (e) {} });
    try { if (wake) wake.release(); } catch (e) {}
    markDirty();
  }
}
function showResult(r){
  modal.classList.add('show'); sheet.innerHTML = '';
  const media = r.kind === 'video' ? el('video', { src: r.url, controls: '', playsinline: '' }) : el('audio', { src: r.url, controls: '' });
  sheet.append(el('h2', null, 'Done ✓'),
    el('p', { class: 'note' }, r.name + ' · ' + (r.blob.size / 1048576).toFixed(1) + ' MB'),
    media);
  const shareable = !inClaude() && canShareFile(toFile(r.blob, r.name));
  if (shareable) sheet.append(
    el('button', { class: 'btn primary block', onclick: () => shareBlob(r.blob, r.name) },
      r.kind === 'video' ? '📲 Save to Photos / Share' : '📲 Save / Share'),
    el('p', { class: 'note', style: 'text-align:center;margin:0 0 4px' },
      r.kind === 'video' ? 'In the share menu tap “Save Video” to put it in Photos.' : 'Tap “Save to Files” in the share menu.'),
    el('button', { class: 'btn block', onclick: () => downloadBlob(r.blob, r.name) }, '⬇ Save to Files'));
  else sheet.append(
    el('button', { class: 'btn primary block', onclick: () => saveBlob(r.blob, r.name) }, '⬇ Save to phone'));
  sheet.append(
    el('button', { class: 'btn block', onclick: openExport }, 'Export again'),
    el('button', { class: 'btn ghost block', onclick: closeModal }, 'Close'));
}

/* ============================================================ start */
resize(); renderPanel(); updateEmpty(); updatePlay(); requestAnimationFrame(frame);
</script>
